[package]
name = "rsa"
version = "0.10.0-rc.17"
authors = ["RustCrypto Developers", "dignifiedquire <dignifiedquire@gmail.com>"]
edition = "2021"
description = "Pure Rust RSA implementation"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/rsa"
repository = "https://github.com/RustCrypto/RSA"
keywords = ["rsa", "encryption", "security", "crypto"]
categories = ["cryptography"]
readme = "README.md"
rust-version = "1.85"
exclude = ["marvin_toolkit/", "thirdparty/"]

[dependencies]
const-oid = { version = "0.10", default-features = false }
crypto-primes = { version = "0.7", default-features = false }
digest = { version = "0.11", default-features = false, features = ["oid"] }
rand_core = { version = "0.10", default-features = false }
signature = { version = "3.0.0-rc.10", default-features = false, features = ["digest", "rand_core"] }
zeroize = { version = "1.8", default-features = false }

# optional dependencies
crypto-common = { version = "0.2", optional = true, features = ["getrandom"] }
pkcs1 = { version = "0.8.0-rc.4", optional = true, default-features = false, features = ["alloc", "pem"] }
serdect = { version = "0.4", optional = true }
sha1 = { version = "0.11.0-rc.5", optional = true, default-features = false, features = ["oid"] }
sha2 = { version = "0.11.0-rc.5", optional = true, default-features = false, features = ["oid"] }
serde = { version = "1.0.184", optional = true, default-features = false, features = ["derive"] }
heapless = { version = "0.8", optional = true, default-features = false }

crypto-bigint = { path = "shims/fake_crypto_bigint", package = "crypto-bigint", default-features = false, features = ["zeroize","rand_core"] }
pkcs8 = { path = "shims/fake_pkcs8", package = "pkcs8", optional= true, default-features = false, features = ["pem"] }
spki = { path = "shims/fake_spki", package = "spki", optional=true, default-features = false, features = [] }

[dev-dependencies]
base64ct = { version = "1", features = ["alloc"] }
hex-literal = "1"
proptest = "1"
serde_test = "1.0.89"
rand = { version = "0.10", features = ["chacha"] }
rand_core = { version = "0.10", default-features = false }
sha1 = { version = "0.11.0-rc.5", default-features = false, features = ["oid"] }
sha2 = { version = "0.11.0-rc.5", default-features = false, features = ["oid"] }
sha3 = { version = "0.11.0-rc.8", default-features = false, features = ["oid"] }
hex = { version = "0.4.3", features = ["serde"] }
serde_json = "1.0.138"
serde = { version = "1.0.184", features = ["derive"] }
rstest = "0.26.1"

[[bench]]
name = "key"

[features]
default = ["std", "encoding", "full" ]
encoding = ["dep:pkcs1", "dep:pkcs8", "dep:spki"]
hazmat = []
getrandom = ["crypto-bigint/getrandom", "crypto-common"]
serde = ["encoding", "dep:serde", "dep:serdect", "crypto-bigint/serde"]
pkcs5 = ["pkcs8/encryption"]
std = ["alloc", "pkcs1?/std", "pkcs8?/std"]
alloc = ["crypto-bigint/shalloc", "crypto-bigint/alloc", "pkcs8/alloc", "spki/alloc", "digest/alloc", "signature/alloc", "zeroize/alloc"]
full = []
hack = ["dep:heapless"]

[package.metadata.docs.rs]
features = ["std", "serde", "hazmat", "sha2"]

[profile.dev]
opt-level = 2

[profile.bench]
debug = true
