[package]
name = "rsa_heapless"
version = "0.5.0"
authors = ["RustCrypto Developers", "dignifiedquire <dignifiedquire@gmail.com>", "kaidokert@gmail.com"]
edition = "2024"
description = "Pure Rust RSA implementation - heapless fork"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/rsa_heapless"
repository = "https://github.com/kaidokert/RSA"
keywords = ["rsa", "encryption", "security", "crypto", "no_std"]
categories = ["cryptography", "no-std", "no-std::no-alloc"]
readme = "README.md"
rust-version = "1.87"
exclude = ["checkct/", "marvin-toolkit/", "thirdparty/", "ct-verify/"]

[lib]
name = "rsa"

[workspace]
members = ["checkct", "checkct/checkct_macros", "marvin-toolkit"]
default-members = ["."]
exclude = ["ct-verify", "footprint"]
resolver = "3"

[workspace.dependencies]
crypto-bigint = { version = "0.7.11", default-features = false, features = ["zeroize", "rand_core"] }
rand = "0.10"
rand_core = { version = "0.10", default-features = false }
zeroize = { version = "1.8", default-features = false }

[dependencies]
const-oid = { version = "0.10", default-features = false }
crypto-primes = { version = "0.7", optional = true, default-features = false }
digest = { version = "0.11", default-features = false, features = ["oid"] }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
rand_core = { workspace = true }
rand_chacha = { version = "0.10", default-features = false }
sha2 = { version = "0.11", default-features = false, features = ["oid", "zeroize"] }
signature = { version = "3", default-features = false, features = ["digest", "rand_core"] }
zeroize = { workspace = true }
ctutils = { version = "0.4", default-features = false }
const-num-traits = { version = "0.2.1", default-features = false, features = ["ct"] }

# optional dependencies
crypto-common = { version = "0.2", optional = true, default-features = false, features = ["rand_core"] }
pkcs1 = { version = "0.8", optional = true, default-features = false, features = ["alloc", "pem"] }
pkcs8 = { version = "0.11", optional = true, default-features = false, features = ["alloc", "pem"] }
serdect = { version = "0.4", optional = true }
sha1 = { version = "0.11", optional = true, default-features = false, features = ["oid"] }
spki = { version = "0.8", optional = true, default-features = false, features = ["alloc"] }
serde = { version = "1.0.184", optional = true, default-features = false, features = ["derive"] }

# Big integer backend
crypto-bigint = { workspace = true, optional = true }
modmath = { version = "0.6.0", optional = true, default-features = false, features = ["zeroize"] }
modmath-cios = { version = "0.1.2", optional = true, default-features = false }
fixed-bigint = { version = "0.6.0", default-features = false, features = ["use-unsafe", "zeroize", "cios"] }
subtle = { version = "2.6", default-features = false }
heapless = "0.9"

[dev-dependencies]
base64ct = { version = "1", features = ["alloc"] }
hex-literal = "1"
proptest = "1"
serde_test = "1.0.89"
rand = { workspace = true, features = ["chacha"] }
rand_core = { workspace = true }
sha1 = { version = "0.11", default-features = false, features = ["oid"] }
sha3 = { version = "0.12", default-features = false, features = ["oid"] }
hex = { version = "0.4.3", features = ["serde"] }
serde_json = "1.0.138"
serde = { version = "1.0.184", features = ["derive"] }
rstest = "0.28"
static_assertions = "1.1"
krabi-caliper = { version = "0.1", features = ["deterministic-rng"] }
crypto-bigint = { version = "0.7", default-features = false, features = ["zeroize", "alloc"] }

[[bench]]
name = "key"

# Host examples that demonstrate the generic `modmath` backend. They use the
# alloc-only `ModMathValue::from_inner` wrapper, so the powerset of features
# must include both `modmath` and `alloc`.
[[example]]
name = "rsa1024_verify"
required-features = ["modmath", "alloc", "pkcs1v15"]

[[example]]
name = "rsa2048_verify"
required-features = ["modmath", "alloc", "pkcs1v15"]

[[example]]
name = "rsa3072_verify"
required-features = ["modmath", "alloc", "pkcs1v15"]

[[example]]
name = "rsa_decrypt"
required-features = ["modmath", "alloc", "pkcs1v15"]

[features]
default = ["std", "encoding", "modmath", "keygen", "getrandom"]
encoding = ["alloc", "dep:pkcs1", "dep:pkcs8", "dep:spki"]
hazmat = []
pkcs1v15 = [] # PKCS #1 v1.5 is only supported as opt-in basis for legacy protocols
getrandom = ["dep:crypto-bigint", "crypto-bigint/getrandom", "crypto-common/getrandom"]
serde = ["encoding", "dep:serde", "dep:serdect", "dep:crypto-bigint", "crypto-bigint/serde"]
pkcs5 = ["pkcs8/encryption"]
std = ["alloc", "pkcs1?/std", "pkcs8?/std"]
alloc = ["dep:crypto-bigint", "crypto-bigint/alloc", "pkcs8/alloc", "spki/alloc", "digest/alloc", "signature/alloc", "zeroize/alloc"]

# On-device key generation (`PrivateKey::new` and friends). Pulls the
# heavy `crypto-primes` stack; never available on the no-alloc path —
# heapless targets get keys from a provisioning path (PEM/HSM/firmware
# constants), not generated on-device.
keygen = ["alloc", "dep:crypto-primes", "dep:crypto-common"]
modmath = ["dep:modmath", "dep:modmath-cios"]
# Constant-time *measurement* hook: lets a hardware harness register a per-stage
# probe (`ct_probe::set_probe`) that the blinded private op calls to localize a
# timing delta. Off by default; shipped builds carry nothing.
ct-cycle-probe = []
# Constant-time *taint* hook: lets a Valgrind taint harness register a
# declassifier (`ct_probe::set_declassifier`) for values that are public by
# design but computed from the secret. Off by default; shipped builds carry
# nothing.
ct-declassify = []

[lints.clippy]
borrow_as_ptr = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
implicit_saturating_sub = "warn"
integer_division_remainder_used = "warn"
manual_assert = "warn"
map_unwrap_or = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
mod_module_files = "warn"
must_use_candidate = "warn"
needless_range_loop = "allow"
ptr_as_ptr = "warn"
redundant_closure_for_method_calls = "warn"
ref_as_ptr = "warn"
return_self_not_must_use = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
unnecessary_safety_comment = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"

[lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
# `deny`, not upstream's `forbid`: the fork has three reviewed `unsafe`
# blocks, each with a local `allow`.
unsafe_code = "deny"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[package.metadata.docs.rs]
all-features = true

[profile.dev]
opt-level = 2

[profile.bench]
debug = true
