[package]
name = "rsa_heapless"
version = "0.2.1"
authors = ["RustCrypto Developers", "dignifiedquire <dignifiedquire@gmail.com>", "kaidokert@gmail.com"]
edition = "2021"
description = "Pure Rust RSA implementation - heapless fork"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/rsa_heapless"
repository = "https://github.com/kaidokert/RSA"
keywords = ["rsa", "encryption", "security", "crypto", "no_std"]
categories = ["cryptography", "no-std", "no-std::no-alloc"]
readme = "README.md"
rust-version = "1.87"
exclude = ["marvin_toolkit/", "thirdparty/"]

[lib]
name = "rsa"

[dependencies]
const-oid = { version = "0.10", default-features = false }
crypto-primes = { version = "0.7", optional = true, default-features = false }
digest = { version = "0.11", default-features = false, features = ["oid"] }
rand_core = { version = "0.10", default-features = false }
signature = { version = "3", default-features = false, features = ["digest", "rand_core"] }
zeroize = { version = "1.8", default-features = false }
ctutils = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }

# optional dependencies
crypto-common = { version = "0.2", optional = true, features = ["getrandom"] }
pkcs1 = { version = "0.8.0-rc.4", optional = true, default-features = false, features = ["alloc", "pem"] }
pkcs8 = { version = "0.11", optional = true, default-features = false, features = ["alloc", "pem"] }
serdect = { version = "0.4", optional = true }
sha1 = { version = "0.11", optional = true, default-features = false, features = ["oid"] }
sha2 = { version = "0.11", optional = true, default-features = false, features = ["oid"] }
spki = { version = "0.8", optional = true, default-features = false, features = ["alloc"] }
serde = { version = "1.0.184", optional = true, default-features = false, features = ["derive"] }

# Big integer backend
crypto-bigint = { version = "0.7.1", optional = true, default-features = false, features = ["zeroize","rand_core"] }
modmath = { version = "0.3.0", optional = true, default-features = false, features = ["wide-mul", "zeroize"] }
fixed-bigint = { version = "0.3.2", optional = true, default-features = false, features = ["zeroize", "use-unsafe"] }
subtle = { version = "2.6", default-features = false }
heapless = "0.9"

[dev-dependencies]
base64ct = { version = "1", features = ["alloc"] }
hex-literal = "1"
proptest = "1"
serde_test = "1.0.89"
rand = { version = "0.10", features = ["chacha"] }
rand_core = { version = "0.10", default-features = false }
sha1 = { version = "0.11", default-features = false, features = ["oid"] }
sha2 = { version = "0.11", default-features = false, features = ["oid"] }
sha3 = { version = "0.11", default-features = false, features = ["oid"] }
hex = { version = "0.4.3", features = ["serde"] }
serde_json = "1.0.138"
serde = { version = "1.0.184", features = ["derive"] }
rstest = "0.26.1"
crypto-bigint = { version = "0.7", default-features = false, features = ["zeroize", "alloc"] }
fixed-bigint = { version = "0.3.2", default-features = false, features = ["zeroize", "use-unsafe"] }

[[bench]]
name = "key"

# Host examples that demonstrate the generic `modmath` backend. They use the
# alloc-only `ModMathValue::from_inner` wrapper, so the powerset of features
# must include both `modmath` and `alloc`.
[[example]]
name = "rsa1024_verify"
required-features = ["modmath", "alloc"]

[[example]]
name = "rsa2048_verify"
required-features = ["modmath", "alloc"]

[[example]]
name = "rsa3072_verify"
required-features = ["modmath", "alloc"]

[[example]]
name = "rsa_decrypt"
required-features = ["modmath", "alloc"]

[features]
default = ["std", "encoding", "modmath"]
encoding = ["alloc", "private-key", "dep:pkcs1", "dep:pkcs8", "dep:spki"]
hazmat = []
getrandom = ["dep:crypto-bigint", "crypto-bigint/getrandom", "crypto-common"]
serde = ["encoding", "dep:serde", "dep:serdect", "dep:crypto-bigint", "crypto-bigint/serde"]
pkcs5 = ["pkcs8/encryption"]
std = ["alloc", "pkcs1?/std", "pkcs8?/std"]
alloc = ["dep:crypto-bigint", "crypto-bigint/alloc", "pkcs8/alloc", "spki/alloc", "digest/alloc", "signature/alloc", "zeroize/alloc"]

# Enable private key support, doesn't work with no-alloc
private-key = ["alloc", "dep:crypto-primes"]
modmath = ["dep:modmath", "dep:fixed-bigint"]

# In-progress: gate for individual private-key functions that have been
# generalized to work on the no_alloc / modmath path. Enabling this alone
# (without `private-key`) compiles and tests the ported subset; enabling
# both gives you the full alloc-bound surface plus any newly ported items.
wip-private-key = []

[package.metadata.docs.rs]
features = ["std", "serde", "hazmat", "sha2"]

[profile.dev]
opt-level = 2

[profile.bench]
debug = true
