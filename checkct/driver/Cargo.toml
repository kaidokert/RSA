[package]
name = "driver"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
checkct_macros = { path = "../checkct_macros" }
rsa = { package = "rsa_heapless", path = "../..", default-features = false, features = ["alloc", "hazmat"] }
crypto-bigint = { version = "0.7", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
# RNG traits supplied by cargo-checkct's generated rng.rs.
rand_core = "0.10"
rand_core_09 = { package = "rand_core", version = "0.9" }
rand_core_06 = { package = "rand_core", version = "0.6" }

# `src/algorithms/pad.rs` is compiled into this crate by path; its
# alloc-gated items need the same cfg here.
[features]
default = ["alloc"]
alloc = []
