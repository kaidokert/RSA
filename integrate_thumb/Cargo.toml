[package]
name = "integrate_thumb"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6.0", features = ["exit"] }
rsa = { path = "../", package = "rsa" , default-features = false , features= ["modmath"]}
sha1 = { version = "0.11.0-rc.0", default-features = false, features = ["oid"] }
