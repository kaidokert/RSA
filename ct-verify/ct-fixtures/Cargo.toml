[package]
name = "ct-fixtures"
version = "0.0.0"
edition = "2021"
publish = false

# `staticlib` for the driver (cross-build → llvm-objdump the `.a`);
# `rlib` so the taint harness can link the same symbols as a dependency.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# `panic-handler` makes the crate `no_std` with its own `#[panic_handler]`,
# needed for the cross-built staticlib the asm-grep driver disassembles
# (the driver passes `--features panic-handler` explicitly). Off by
# default so the ctgrind crate can link this as an rlib into its std
# binary, where std supplies the panic handler and a second would collide.
default = []
panic-handler = []

[dependencies]
rsa = { path = "../..", package = "rsa_heapless", default-features = false, features = ["modmath"] }
fixed-bigint = { version = "0.5.2", default-features = false, features = ["zeroize", "use-unsafe", "cios"] }
const-num-traits = { version = "0.2.0", default-features = false, features = ["ct"] }
sha2 = { version = "0.11", default-features = false, features = ["oid"] }
rand_core = { version = "0.10", default-features = false }
