[profiles.jtrace-f407-168mhz]
runner = "command"
target = "thumbv7em-none-eabihf"
build-features = ["clock-168mhz"]
board = "jtrace-reference-board"
mcu = "STM32F407VG"
transport = "rtt"
probe = "${KRABI_PROBE}"
clock-frequency-hz = 168000000
executable = "probe-rs"
args = [
  "attach",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "${KRABI_PROBE}",
  "--non-interactive",
  "--disable-progressbars",
  "--no-location",
  "{artifact}",
]
completion-marker = "EM_SUMMARY"
completion-action = "interrupt"
timeout-seconds = 900
target-dir = "target"
artifact-extension = ""

[[profiles.jtrace-f407-168mhz.prepare]]
executable = "probe-rs"
args = [
  "download",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "${KRABI_PROBE}",
  "--non-interactive",
  "--disable-progressbars",
  "{artifact}",
]
timeout-seconds = 120

[[profiles.jtrace-f407-168mhz.prepare]]
executable = "probe-rs"
args = [
  "reset",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "${KRABI_PROBE}",
  "--non-interactive",
]
timeout-seconds = 30

[[case-sets.rsa-signing-cyccnt]]
name = "rsa512-u32x16"
binary = "rsa-cyccnt-hardware"
features = ["rsa512", "carrier-u32x16"]
expected-suite = "rsa512-cyccnt"
delay-before-run-seconds = 60

[[case-sets.rsa-signing-cyccnt]]
name = "rsa512-u8x64"
binary = "rsa-cyccnt-hardware"
features = ["rsa512", "carrier-u8x64"]
expected-suite = "rsa512-cyccnt"
timeout-seconds = 900
delay-before-run-seconds = 120

[[case-sets.rsa-signing-cyccnt]]
name = "rsa1024-u32x32"
binary = "rsa-cyccnt-hardware"
features = ["rsa1024", "carrier-u32x32"]
expected-suite = "rsa1024-cyccnt"
timeout-seconds = 900
delay-before-run-seconds = 120

[[case-sets.rsa-signing-cyccnt]]
name = "rsa2048-u32x64"
binary = "rsa-cyccnt-hardware"
features = ["rsa2048", "carrier-u32x64"]
expected-suite = "rsa2048-cyccnt"
timeout-seconds = 1800
delay-before-run-seconds = 300

[campaigns.rsa-signing-ct-jtrace-f407]
profile = "jtrace-f407-168mhz"
case-set = "rsa-signing-cyccnt"
constant-time = { welch-threshold = 4.5, minimum-samples-per-class = 4, protected-classes = ["positive"], control-classes = ["negative"], gate = false }

[[case-sets.rsa512-statistical-cyccnt]]
name = "rsa512-u32x16-statistical"
binary = "rsa-cyccnt-hardware"
features = ["rsa512", "carrier-u32x16", "statistical-campaign"]
expected-suite = "rsa512-cyccnt"
timeout-seconds = 1200
delay-before-run-seconds = 60

[campaigns.rsa512-statistical-ct-jtrace-f407]
profile = "jtrace-f407-168mhz"
case-set = "rsa512-statistical-cyccnt"
constant-time = { welch-threshold = 4.5, minimum-samples-per-class = 100, protected-classes = ["positive"], control-classes = ["negative"], gate = true }

# ── 30 MHz, 0 wait states ────────────────────────────────────────────
# The deterministic measurement regime: 0 WS => no ART prefetch/I-cache, so
# core-cycle counts carry no fetch jitter (unlike the 168 MHz profile above,
# whose ART jitter scales with operation length and swamps the tight gate).
[profiles.jtrace-f407-30mhz-0ws]
runner = "command"
target = "thumbv7em-none-eabihf"
build-features = ["clock-30mhz"]
board = "jtrace-reference-board"
mcu = "STM32F407VG"
transport = "rtt"
probe = "${KRABI_PROBE}"
clock-frequency-hz = 30000000
executable = "probe-rs"
args = [
  "attach",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "${KRABI_PROBE}",
  "--non-interactive",
  "--disable-progressbars",
  "--no-location",
  "{artifact}",
]
completion-marker = "EM_SUMMARY"
completion-action = "interrupt"
timeout-seconds = 900
target-dir = "target"
artifact-extension = ""

[[profiles.jtrace-f407-30mhz-0ws.prepare]]
executable = "probe-rs"
args = [
  "download",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "${KRABI_PROBE}",
  "--non-interactive",
  "--disable-progressbars",
  "{artifact}",
]
timeout-seconds = 120

[[profiles.jtrace-f407-30mhz-0ws.prepare]]
executable = "probe-rs"
args = [
  "reset",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "${KRABI_PROBE}",
  "--non-interactive",
]
timeout-seconds = 30

# rsa768 (u32x24, 96-byte modulus): the CT gate proper. 768 is the smallest
# OAEP-SHA256-compatible width, so the gate exercises a realistic key. At 0 WS
# the measurement is deterministic (near-zero variance), so a small sample count
# yields a valid verdict — the rsa512@30MHz precedent got a genuine t=0.655 pass
# at this same count; validity comes from the determinism, not from N.
[[case-sets.rsa768-cyccnt-30mhz]]
name = "rsa768-u32x24-30mhz"
binary = "rsa-cyccnt-hardware"
features = ["rsa768", "carrier-u32x24"]
expected-suite = "rsa768-cyccnt"
timeout-seconds = 600

[campaigns.rsa768-ct-jtrace-f407-30mhz]
profile = "jtrace-f407-30mhz-0ws"
case-set = "rsa768-cyccnt-30mhz"
constant-time = { welch-threshold = 4.5, minimum-samples-per-class = 4, protected-classes = ["positive"], control-classes = ["negative"], gate = true }

# rsa2048 (u32x64) functional smoke at 168 MHz: not a CT gate (gate = false) —
# the CT property is width-independent and proven at 768; this only confirms a
# deployment-width key signs correctly on hardware (output + RNG-draw checks).
# 168 MHz keeps its wall time bounded (a 2048 sign at 30 MHz would run minutes).
[[case-sets.rsa2048-smoke-168mhz]]
name = "rsa2048-u32x64-smoke"
binary = "rsa-cyccnt-hardware"
features = ["rsa2048", "carrier-u32x64"]
expected-suite = "rsa2048-cyccnt"
timeout-seconds = 1800

[campaigns.rsa2048-smoke-jtrace-f407-168mhz]
profile = "jtrace-f407-168mhz"
case-set = "rsa2048-smoke-168mhz"
constant-time = { welch-threshold = 4.5, minimum-samples-per-class = 4, protected-classes = ["positive"], control-classes = ["negative"], gate = false }
