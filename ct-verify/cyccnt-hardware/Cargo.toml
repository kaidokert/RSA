[package]
name = "rsa-cyccnt-hardware"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["clock-168mhz"]
clock-168mhz = ["dep:stm32f4xx-hal"]
rsa512 = []
rsa1024 = []
rsa2048 = []
carrier-u32x16 = []
carrier-u32x32 = []
carrier-u32x64 = []
carrier-u8x64 = []
etm-single-trial = []
statistical-campaign = []
# Per-stage DWT localizer: registers a probe with the crate's `ct-cycle-probe`
# hook and prints per-stage A-vs-B deltas so a rig run can name which sub-op
# carries the key-dependent cycle difference. See LOCALIZATION_ANALYSIS.md.
localize = ["rsa/ct-cycle-probe"]

[dependencies]
const-num-traits = { version = "0.2", default-features = false, features = ["ct"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
krabi-caliper = { version = "=0.1.2-alpha.1", git = "https://github.com/kaidokert/krabi-caliper-rs", tag = "v0.1.2-alpha.1", features = ["cortex-m", "cortex-m-dwt", "paired", "rtt", "stack"] }
fixed-bigint = { version = "0.6.0", default-features = false, features = ["zeroize", "use-unsafe", "cios"] }
rand_core = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
rsa = { path = "../..", package = "rsa_heapless", default-features = false, features = ["modmath"] }
sha2 = { version = "0.11", default-features = false, features = ["oid"] }
stm32f4xx-hal = { version = "0.23", default-features = false, features = ["stm32f407"], optional = true }
