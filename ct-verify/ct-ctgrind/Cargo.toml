[package]
name = "ct-ctgrind"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Valgrind taint-based CT verifier for the rsa_heapless heapless sign path."

[[bin]]
name = "ct-ctgrind"
path = "src/main.rs"

[dependencies]
# The fixtures as a Rust rlib so this binary can call each `extern "C"`
# symbol directly. `default-features = false` drops the fixture crate's
# own `#[panic_handler]` — this binary is std, and std provides one.
ct-fixtures = { path = "../ct-fixtures", default-features = false }

# Only for the `ct-declassify` hook; feature unification turns it on for the
# fixtures' copy too.
rsa = { path = "../..", package = "rsa_heapless", default-features = false, features = ["ct-declassify"] }

krabi-caliper = { version = "0.2", features = ["ctgrind"] }
