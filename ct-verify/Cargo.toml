# Nested workspace for the constant-time verification harness. Kept
# separate from the main crate (which is a standalone package, not a
# workspace) so the pinned deterministic release profile below applies
# to every harness build without affecting `rsa_heapless`'s own
# `--release` builds. Same isolation pattern as `footprint/*`.
[workspace]
resolver = "2"
members = ["ct-fixtures", "ct-driver", "ct-ctgrind"]

# Deterministic codegen: the asm-grep / taint layers must inspect the
# exact machine code a deployment build emits, and a passing run "locks"
# that inspection — so a toolchain bump that perturbs codegen surfaces
# as a reviewable diff rather than silent drift.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
incremental = false
