# Skip the footprint sub-crates (they're separate Cargo manifests
# with their own formatting needs — fixtures contain hand-curated
# large constant arrays that cargo-fmt would mangle) and the
# bundled third-party material that Cargo's `exclude` already keeps
# out of published builds.
exclude: '^(footprint/|marvin-toolkit/|thirdparty/)'

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: check-json
    -   id: check-yaml
    -   id: check-toml
    -   id: mixed-line-ending
        args: ["--fix=lf"]
    -   id: fix-byte-order-marker

-   repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
    -   id: fmt
    -   id: cargo-check
    -   id: clippy
        args: ['--all', '--', '-D', 'warnings']
