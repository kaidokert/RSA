[build]
target = "avr-none"
# sha2 0.11 selects its soft backend via rustc cfg, not a cargo feature;
# compact keeps the size-measurement harness honest.
rustflags = ["-C", "target-cpu=atmega2560", "--cfg", 'sha2_backend_soft="compact"']

[unstable]
build-std = ["core"]

[target.avr-none]
# Installed by `cargo install krabi-caliper --features cli`.
runner = "krabi-caliper-simavr -t 300 --completion-marker status:PASS -- -m atmega2560 -f 16000000"
