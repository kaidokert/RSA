[package]
name = "rsa_footprint_riscv"
version = "0.1.0"
edition = "2024"
autobins = false
autotests = false
autobenches = false

[features]
baseline = []
# Key-size selectors for the unified `rsa_verify` example. Pick exactly one.
key_512 = []
key_768 = []
key_1024 = []
key_1536 = []
key_2048 = []
key_3072 = []
key_4096 = []
# Limb-size selectors for the unified `rsa_verify` example. Pick exactly one.
limb_u8 = []
limb_u32 = []
# Hash-algorithm selectors. Pick exactly one. SHA-1 only paired with key_512.
hash_sha1 = []
hash_sha256 = []

[dependencies]
riscv-rt = "0.13"

fixed-bigint = { version = "0.6.0", default-features = false, features = ["zeroize", "use-unsafe", "cios"] }
rsa = { path = "../..", package = "rsa_heapless", default-features = false, features = ["modmath"] }
sha1 = { version = "0.11.0-rc.5", default-features = false, features = ["oid"] }
sha2 = { version = "0.11.0-rc.5", default-features = false, features = ["oid"] }

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "z"

# modmath-cios is unpublished (in-repo member of the git-pinned modmath
# rev). Published fixed-bigint's `cios` feature pulls a crates.io
# modmath-cios; this patch unifies it to the same git rev RSA uses, so
# CiosRowOps/CtParity resolve to one crate (mirrors RSA's own patch).
[patch.crates-io]
modmath-cios = { git = "https://github.com/kaidokert/modmath-rs.git", tag = "v0.6.0-alpha.cios.36" }
