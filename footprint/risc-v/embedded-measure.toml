[profiles.qemu-riscv32]
preset = "qemu-riscv32-sifive-e"
timeout-seconds = 300

[[case-sets.rsa-verify]]
name = "baseline"
example = "baseline"
features = ["baseline"]
expected-benchmark = "rsa-footprint"

[[case-sets.rsa-verify]]
name = "rsa512-sha1-u8"
example = "rsa_verify"
features = ["key_512", "limb_u8", "hash_sha1"]
expected-benchmark = "rsa-footprint"

[[case-sets.rsa-verify]]
name = "rsa512-sha1-u32"
example = "rsa_verify"
