[package]
name = "rsa_footprint_cortex_m"
version = "0.1.0"
edition = "2024"
autobins = false
autotests = false
autobenches = false

[features]
baseline = []

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6", features = ["exit"] }

fixed-bigint = { version = "0.2.5", default-features = false, features = ["zeroize", "use-unsafe"] }
rsa = { path = "../..", package = "rsa", default-features = false, features = ["modmath"] }
sha1 = { version = "0.11.0-rc.5", default-features = false, features = ["oid"] }

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "z"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(thumbv6m)',
    'cfg(thumbv7m)',
    'cfg(thumbv7em)',
] }
