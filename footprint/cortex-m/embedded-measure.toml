[profiles.qemu-cortex-m0]
preset = "qemu-cortex-m0"
timeout-seconds = 300

[profiles.qemu-cortex-m3]
preset = "qemu-cortex-m3"
timeout-seconds = 300

[profiles.qemu-cortex-m4]
preset = "qemu-cortex-m4"
timeout-seconds = 300

[profiles.jtrace-f407]
runner = "command"
target = "thumbv7em-none-eabihf"
build-features = ["jtrace-f407"]
executable = "probe-rs"
args = [
  "run",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "1366:1020:001224000224",
  "--non-interactive",
  "--disable-progressbars",
  "--no-location",
  "{artifact}",
]
completion-marker = "EM_OUTCOME"
completion-action = "interrupt"
timeout-seconds = 120
artifact-extension = ""

[[case-sets.rsa-verify]]
name = "baseline"
example = "baseline"
features = ["baseline"]
expected-benchmark = "rsa-footprint"

[[case-sets.rsa-verify]]
name = "rsa512-sha1-u8"
example = "rsa_verify"
features = ["key_512", "limb_u8", "hash_sha1"]
expected-benchmark = "rsa-footprint"

