[target.thumbv6m-none-eabi]
runner = "qemu-system-arm -cpu cortex-m0 -machine microbit -nographic -semihosting-config enable=on,target=native -kernel"

[target.thumbv7m-none-eabi]
runner = "qemu-system-arm -cpu cortex-m3 -machine lm3s6965evb -nographic -semihosting-config enable=on,target=native -kernel"

[target.thumbv7em-none-eabi]
runner = "qemu-system-arm -cpu cortex-m4 -machine netduinoplus2 -nographic -semihosting-config enable=on,target=native -kernel"

[build]
target = "thumbv6m-none-eabi"
# sha2 0.11 selects its soft backend via rustc cfg, not a cargo feature.
# Without this the default (speed-oriented) backend costs ~6.5 KB more
# .text — the wrong tradeoff for a size-measurement harness.
rustflags = ['--cfg', 'sha2_backend_soft="compact"']
