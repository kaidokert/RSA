# TEMPORARY: validate the 30 MHz / 0-wait-state regime for RSA on the F407 rig.
# Runs the rsa512 campaign at 30 MHz and reports the sign A/B spread + Welch, to
# confirm the ART jitter (the 168 MHz warmth) is gone at 0 WS. Delete after.
name: hw-30mhz-validate

on:
  push:
    branches: [agent/caliper-conditioned-measurement]

jobs:
  validate:
    runs-on: [self-hosted, rig-stm32f407-dwt]
    permissions:
      contents: read
    container:
      image: 127.0.0.1:5000/pi-hw-runner:latest
      options: --privileged
      volumes:
        - /dev/bus/usb:/dev/bus/usb
        - /run/lock:/run/lock
        - /srv/krabi-caliper/rigs:/rigs:ro
    env:
      RIG: stm32f407-dwt
      CAMPAIGN: rsa512-ct-jtrace-f407-30mhz
      KRABI_RIG_DIR: /rigs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 30 MHz rsa512 campaign
        shell: bash
        working-directory: ct-verify/cyccnt-hardware
        run: |
          set -uo pipefail
          export PATH="/usr/local/cargo/bin:$HOME/.cargo/bin:$PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          env_file="${KRABI_RIG_DIR:-$HOME/.config/krabi-caliper/rigs}/$RIG.env"
          [ -f "$env_file" ] || { echo "::error::rig '$RIG' has no env ($env_file)"; exit 1; }
          set -a; source "$env_file"; set +a
          : "${KRABI_PROBE:?rig $RIG did not export KRABI_PROBE}"

          exec 9>"/run/lock/krabi-rig-$RIG"
          flock -w 1800 9
          probe-rs list | grep -qF "$KRABI_PROBE" \
            || { echo "::error::probe $KRABI_PROBE not attached"; exit 1; }

          cargo krabi-caliper run "$CAMPAIGN" 2>&1 | tee run.log || true

          echo "===== WELCH / VERDICT ====="
          grep -E '^\|' run.log | grep -iE "Case|pkcs1v15_blinded_sign|negative_early_exit|key_construction" | sort -u || echo "(none)"
          echo "===== per-class spread (from EM_SAMPLE) ====="
          python3 - <<'PY'
          import re
          from statistics import mean, pstdev
          rows={}; freq=None
          for line in open('run.log'):
              mf=re.search(r'frequency_hz:(\d+)', line)
              if mf: freq=int(mf.group(1))
              m=re.search(r'EM_SAMPLE .*fixture:(\S+) side:(\S+) index:\d+ ticks:(\d+)', line)
              if m: rows.setdefault((m.group(1),m.group(2)),[]).append(int(m.group(3)))
          print(f"clock frequency_hz: {freq}")
          for fx in ['pkcs1v15_blinded_sign','negative_early_exit','key_construction']:
              a=rows.get((fx,'A')); b=rows.get((fx,'B'))
              if not a and not b: continue
              print(f"== {fx} ==")
              if a: print(f"  A: n={len(a)} mean={mean(a):.1f} spread={max(a)-min(a)} sd={pstdev(a):.2f}")
              if b: print(f"  B: n={len(b)} mean={mean(b):.1f} spread={max(b)-min(b)} sd={pstdev(b):.2f}")
              if a and b: print(f"  A-B mean delta = {mean(a)-mean(b):+.1f}")
          PY
