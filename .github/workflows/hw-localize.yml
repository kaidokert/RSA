# TEMPORARY diagnostic: flash the `localize` fixture on the STM32F407 rig and
# stream its per-stage DWT deltas (LOCALIZE_STAGE ...) back into the run log.
# Runs only on the cyccnt-hardware-followup branch. Delete after the experiment.
name: hw-localize

on:
  push:
    branches: [agent/cyccnt-hardware-followup]

jobs:
  localize:
    runs-on: [self-hosted, rig-stm32f407-dwt]
    permissions:
      contents: read
    container:
      image: 127.0.0.1:5000/pi-hw-runner:latest
      options: --privileged
      volumes:
        - /dev/bus/usb:/dev/bus/usb
        - /run/lock:/run/lock
        - /srv/krabi-caliper/rigs:/rigs:ro
    env:
      RIG: stm32f407-dwt
      KRABI_RIG_DIR: /rigs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: build + flash localize, capture per-stage RTT
        shell: bash
        working-directory: ct-verify/cyccnt-hardware
        run: |
          set -euo pipefail
          export PATH="/usr/local/cargo/bin:$HOME/.cargo/bin:$PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # rig facts (KRABI_PROBE) from the mounted, read-only rig env.
          env_file="${KRABI_RIG_DIR:-$HOME/.config/krabi-caliper/rigs}/$RIG.env"
          [ -f "$env_file" ] || { echo "::error::rig '$RIG' has no env ($env_file)"; exit 1; }
          set -a; source "$env_file"; set +a
          : "${KRABI_PROBE:?rig $RIG did not export KRABI_PROBE}"

          # serialize against every other container touching this rig.
          exec 9>"/run/lock/krabi-rig-$RIG"
          flock -w 1800 9

          probe-rs list | grep -qF "$KRABI_PROBE" \
            || { echo "::error::probe $KRABI_PROBE not attached"; exit 1; }

          cargo build --release --target thumbv7em-none-eabihf --no-default-features \
            --features clock-168mhz,rsa512,carrier-u32x16,localize

          ELF=$(find "$GITHUB_WORKSPACE" -type f \
                  -path '*thumbv7em-none-eabihf/release/rsa-cyccnt-hardware' 2>/dev/null | head -1)
          [ -n "$ELF" ] || { echo "::error::localize ELF not found"; exit 1; }
          echo "ELF=$ELF"

          CHIP=(--chip STM32F407VGTx --protocol swd --probe "$KRABI_PROBE" --non-interactive)
          probe-rs download "${CHIP[@]}" --disable-progressbars "$ELF"
          probe-rs reset "${CHIP[@]}"

          echo "===== streaming RTT (45s cap) ====="
          timeout 45 probe-rs attach "${CHIP[@]}" --disable-progressbars --no-location "$ELF" 2>&1 \
            | tee rtt.log || true

          echo "===== LOCALIZE RESULTS ====="
          if grep -E "LOCALIZE_STAGE|LOCALIZE_SUMMARY" rtt.log; then
            :
          else
            echo "::warning::no LOCALIZE lines captured — tail of RTT log:"
            tail -60 rtt.log || true
          fi
