name: CI

on:
  pull_request:
  push:
    branches:
      - heapless
      - 'feature/**'
  schedule:
    - cron: "23 4 * * 1"

env:
  RUSTFLAGS: "-Dwarnings"
  RUSTDOCFLAGS: "-Dwarnings"

# Cancels CI jobs when new commits are pushed to a PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.87.0 # MSRV
          - stable
        target:
          - thumbv7em-none-eabi
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}
      - run: cargo build --no-default-features --features pkcs1v15 --target ${{ matrix.target }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.87.0 # MSRV
          - stable
        # The fork's extra features make the powerset several times larger
        # than upstream's; split it across jobs so wall-clock stays bounded.
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: RustCrypto/actions/cargo-hack-install@master
      # `ct-cycle-probe` and `ct-declassify` are measurement hooks, no-ops
      # unless a harness registers a callback; one run below covers them.
      - run: >-
          cargo hack test -p rsa_heapless --release --feature-powerset
          --exclude-features getrandom,serde,ct-cycle-probe,ct-declassify
          --partition ${{ matrix.partition }}/4
      - if: matrix.partition == 1
        run: cargo test --release --features getrandom
      - if: matrix.partition == 2
        run: cargo test --release --features serde
      - if: matrix.partition == 3
        run: cargo test --release --features ct-cycle-probe,ct-declassify

  # Generate code coverage and report to codecov.io
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov -p rsa_heapless --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  minimal-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-01
      - run: cargo update -Z minimal-versions
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --features getrandom,serde,pkcs5,pkcs1v15

  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-01
      - run: cargo build --features pkcs1v15 --benches
