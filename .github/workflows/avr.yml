name: AVR

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  avr:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # AVR pin comes from footprint/avr/rust-toolchain.toml (nightly with
    # build-std support). Listing it here too keeps the action self-explanatory.
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2025-11-01
        components: rust-src, llvm-tools

    - name: Install simavr and AVR toolchain
      run: sudo apt-get update && sudo apt-get install -y simavr gcc-avr avr-libc

    - name: Install krabi-caliper host tooling
      run: cargo install krabi-caliper --git https://github.com/kaidokert/krabi-caliper-rs --tag v0.1.0-alpha.4 --features cli,campaign

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          footprint/avr/target
        key: avr-${{ hashFiles('footprint/avr/Cargo.toml', 'Cargo.toml') }}
        restore-keys: avr-

    - name: Run AVR suite (CI fast subset — 512-bit only)
      # The `rsa-avr` campaign adds the 768/1024/1536-bit cells locally;
      # simavr is too slow on GitHub runners for that full sweep.
      run: |
        set -o pipefail
        cargo krabi-caliper run rsa-avr-fast | tee -a "$GITHUB_STEP_SUMMARY"
      working-directory: footprint/avr
