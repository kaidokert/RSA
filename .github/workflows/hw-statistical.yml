# TEMPORARY: 100-sample conditioned statistical campaign on the F407 rig, to
# validate caliper #29's per-sample conditioning at meaningful sample depth.
# Captures Welch/means/spread/negatives + the conditioning field + DWT wraps,
# and uploads the raw sample log. Branch-scoped; delete after the readout.
name: hw-statistical

on:
  push:
    branches: [agent/caliper-conditioned-measurement]

jobs:
  statistical:
    runs-on: [self-hosted, rig-stm32f407-dwt]
    permissions:
      contents: read
    container:
      image: 127.0.0.1:5000/pi-hw-runner:latest
      options: --privileged
      volumes:
        - /dev/bus/usb:/dev/bus/usb
        - /run/lock:/run/lock
        - /srv/krabi-caliper/rigs:/rigs:ro
    env:
      RIG: stm32f407-dwt
      CAMPAIGN: rsa512-statistical-ct-jtrace-f407
      KRABI_RIG_DIR: /rigs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 100-sample conditioned statistical campaign
        shell: bash
        working-directory: ct-verify/cyccnt-hardware
        run: |
          set -euo pipefail
          export PATH="/usr/local/cargo/bin:$HOME/.cargo/bin:$PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          env_file="${KRABI_RIG_DIR:-$HOME/.config/krabi-caliper/rigs}/$RIG.env"
          [ -f "$env_file" ] || { echo "::error::rig '$RIG' has no env ($env_file)"; exit 1; }
          set -a; source "$env_file"; set +a
          : "${KRABI_PROBE:?rig $RIG did not export KRABI_PROBE}"

          exec 9>"/run/lock/krabi-rig-$RIG"
          flock -w 1800 9
          probe-rs list | grep -qF "$KRABI_PROBE" \
            || { echo "::error::probe $KRABI_PROBE not attached"; exit 1; }

          # gate=true: a CT-fail exits non-zero; capture the full log regardless.
          cargo krabi-caliper run "$CAMPAIGN" 2>&1 | tee stat.log || true

          echo "===== WELCH / VERDICT ====="
          grep -E '^\|' stat.log | grep -iE "Case|pkcs1v15_blinded_sign|negative_early_exit|key_construction" | sort -u || echo "(none)"
          echo "===== MEANS / SPREAD / VARIANCE / SAMPLES ====="
          grep -iE "mean|median|spread|variance|stddev|min:|max:|n[ab]=|samples|EM_MEASUREMENT|ticks:" stat.log | head -60 || echo "(none)"
          echo "===== CONDITIONING EVIDENCE (must appear) ====="
          grep -iE "sign_conditioning|per-sample-prewarm|conditioning|conditioned" stat.log | head || echo "::warning::conditioning field not found in evidence"
          echo "===== DWT WRAPS ====="
          grep -iE "wrap" stat.log | head || echo "no wrap lines"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statistical-conditioned-log
          path: ct-verify/cyccnt-hardware/stat.log
          if-no-files-found: warn
