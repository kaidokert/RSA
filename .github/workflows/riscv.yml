name: RISC-V

on:
  push:
    branches:
      - heapless
      - 'feature/**'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  riscv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # riscv-rt 0.13 no longer assembles on Rust 1.99+ (`.cfi_endproc` outside a frame).
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.98.1
        targets: riscv32imac-unknown-none-elf
        components: llvm-tools

    # Ubuntu 26.04 (qemu 10) ships RISC-V in its own package; 24.04 has it in -misc.
    - name: Install QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-riscv || sudo apt-get install -y qemu-system-misc
        command -v qemu-system-riscv32

    - name: Install krabi-caliper host tooling
      run: cargo install krabi-caliper --version 0.1.0 --features cli,campaign

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          footprint/risc-v/target
        key: riscv-${{ hashFiles('footprint/risc-v/Cargo.toml', 'Cargo.toml') }}
        restore-keys: riscv-

    - name: Run RISC-V suite
      run: |
        set -o pipefail
        cargo krabi-caliper run rsa-riscv32 | tee -a "$GITHUB_STEP_SUMMARY"
      working-directory: footprint/risc-v
