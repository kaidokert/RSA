name: Cortex-M

on:
  push:
    branches:
      - heapless
      - 'feature/**'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  cortex-m:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: thumbv6m-none-eabi, thumbv7m-none-eabi, thumbv7em-none-eabi
        components: llvm-tools

    - name: Install QEMU
      run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

    - name: Install krabi-caliper host tooling
      run: cargo install krabi-caliper --version 0.1.1 --features cli,campaign

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          footprint/cortex-m/target
        key: cortex-m-${{ hashFiles('footprint/cortex-m/Cargo.toml', 'Cargo.toml') }}
        restore-keys: cortex-m-

    - name: Run Cortex-M suite
      env:
        # Config validation also visits the unused hardware profile.
        KRABI_PROBE: unused-by-qemu-campaigns
      run: |
        set -o pipefail
        for campaign in rsa-cortex-m0 rsa-cortex-m3 rsa-cortex-m4; do
          cargo krabi-caliper run "$campaign"
        done | tee -a "$GITHUB_STEP_SUMMARY"
      working-directory: footprint/cortex-m
