# TEMPORARY: on the same rig session and identical code, run BOTH the raw-DWT
# localizer (whole-sign, back-to-back) AND the PairedSuite campaign
# (reset + dsb/isb + critical-section + warmup), so the 142M-vs-128M and the
# 28K A-vs-B can be pinned to the measurement method rather than the crypto.
# Branch-scoped and temporary — delete after the experiment.
name: hw-compare

on:
  push:
    branches: [agent/cyccnt-hardware-followup]

jobs:
  compare:
    runs-on: [self-hosted, rig-stm32f407-dwt]
    permissions:
      contents: read
    container:
      image: 127.0.0.1:5000/pi-hw-runner:latest
      options: --privileged
      volumes:
        - /dev/bus/usb:/dev/bus/usb
        - /run/lock:/run/lock
        - /srv/krabi-caliper/rigs:/rigs:ro
    env:
      RIG: stm32f407-dwt
      KRABI_RIG_DIR: /rigs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: raw localizer vs paired-suite campaign, same session
        shell: bash
        working-directory: ct-verify/cyccnt-hardware
        run: |
          set -euo pipefail
          export PATH="/usr/local/cargo/bin:$HOME/.cargo/bin:$PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          env_file="${KRABI_RIG_DIR:-$HOME/.config/krabi-caliper/rigs}/$RIG.env"
          [ -f "$env_file" ] || { echo "::error::rig '$RIG' has no env ($env_file)"; exit 1; }
          set -a; source "$env_file"; set +a
          : "${KRABI_PROBE:?rig $RIG did not export KRABI_PROBE}"

          exec 9>"/run/lock/krabi-rig-$RIG"
          flock -w 1800 9
          probe-rs list | grep -qF "$KRABI_PROBE" \
            || { echo "::error::probe $KRABI_PROBE not attached"; exit 1; }

          CHIP=(--chip STM32F407VGTx --protocol swd --probe "$KRABI_PROBE" --non-interactive)

          echo "############## 1. RAW LOCALIZER (whole-sign, back-to-back DWT) ##############"
          cargo build --release --target thumbv7em-none-eabihf --no-default-features \
            --features clock-168mhz,rsa512,carrier-u32x16,localize
          ELF=$(find "$GITHUB_WORKSPACE" -type f \
                  -path '*thumbv7em-none-eabihf/release/rsa-cyccnt-hardware' 2>/dev/null | head -1)
          probe-rs download "${CHIP[@]}" --disable-progressbars "$ELF"
          probe-rs reset "${CHIP[@]}"
          timeout 45 probe-rs attach "${CHIP[@]}" --disable-progressbars --no-location "$ELF" 2>&1 \
            | tee raw.log || true
          echo "----- RAW RESULT -----"
          grep -E "LOCALIZE_STAGE|LOCALIZE_SUMMARY" raw.log || echo "(none)"

          echo "############## 2. PAIRED-SUITE CAMPAIGN (same code) ##############"
          # gate=false on this campaign, but capture everything regardless.
          cargo krabi-caliper run rsa-signing-ct-jtrace-f407 2>&1 | tee paired.log || true
          echo "----- PAIRED RESULT (sign class) -----"
          grep -iE "pkcs1v15_blinded_sign|EM_MEASUREMENT|mean|spread|welch|comparison|ticks|class|a=|b=" paired.log \
            | grep -iE "sign|mean|spread|welch|ticks|comparison|class" | head -40 || echo "(none)"
