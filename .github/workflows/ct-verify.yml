name: CT verify

on:
  pull_request:
    paths:
      - "ct-verify/**"
      - "src/**"
      # ct-fixtures path-deps the root crate, so its manifest shapes
      # this build too.
      - "Cargo.toml"
      - ".github/workflows/ct-verify.yml"
  push:
    branches:
      - heapless
      - 'feature/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Cross-build the fixture staticlib per ISA, disassemble it, and
  # assert the secret-exponent ladder carries only its reviewed public
  # bit-width loop branch (per-target count) and no more. Narrow by
  # design — the whole-operation CT gate is the taint (ctgrind) harness;
  # this confirms the one property asm-grep can prove cheaply. The
  # driver fails closed if the ladder symbol is absent (inlined/renamed)
  # or if the negative controls stop tripping the mnemonic tables.
  ladder-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabi
          - thumbv7m-none-eabi
          - thumbv6m-none-eabi
          - riscv32imc-unknown-none-elf
          - riscv32imac-unknown-none-elf
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned so codegen — and the calibrated per-ISA ladder branch
          # counts — stay deterministic across CI runs.
          toolchain: 1.87.0
          targets: ${{ matrix.target }}
          components: llvm-tools-preview
      - name: Ladder branch-freedom check
        working-directory: ct-verify
        run: cargo run --release -p ct-driver -- --target ${{ matrix.target }}

  # Cross-build the whole heapless sign path as a DCE'd staticlib and
  # assert the archive links in no `core::panicking` machinery. A
  # reachable panic in a signer is both a DoS edge and a timing oracle
  # (panic formatting's cost depends on the values formatted), so the
  # sign path must resolve every fallible slice/index op to an error
  # return rather than a panic. Target-invariant in practice (the symbols
  # are `core::panicking` references), but run on one ARM + one RISC-V
  # profile to catch any target-specific codegen that reintroduces one.
  panic-free-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7m-none-eabi
          - riscv32imc-unknown-none-elf
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0
          targets: ${{ matrix.target }}
          components: llvm-tools-preview
      - name: Install krabi-caliper
        run: cargo install krabi-caliper --version 0.1.0 --features cli,campaign
      - name: Panic-free sign-path audit
        run: |
          cargo krabi-caliper panic-audit \
            --workspace ct-verify \
            --package panic-free-audit \
            --target ${{ matrix.target }} \
            --features panic-handler \
            --negative-features neg-controls \
            --owned-symbol '.*' \
            --expect-negative panic_audit__neg__bounds_check \
            --expect-negative panic_audit__neg__unwrap \
            --expect-negative panic_audit__neg__expect \
            --json target/panic-audit/${{ matrix.target }}.json
