# TEMPORARY: accumulate 100 conditioned samples via 5 short 20-sample slices,
# each a reliable short attach (with per-chunk retry), then pool the EM_SAMPLE
# records host-side and compute Welch. Avoids the single long attach that the
# probe faults partway through. Branch-scoped; delete after the readout.
name: hw-statistical-chunked

on:
  push:
    branches: [agent/caliper-conditioned-measurement]

jobs:
  chunked:
    runs-on: [self-hosted, rig-stm32f407-dwt]
    permissions:
      contents: read
    container:
      image: 127.0.0.1:5000/pi-hw-runner:latest
      options: --privileged
      volumes:
        - /dev/bus/usb:/dev/bus/usb
        - /run/lock:/run/lock
        - /srv/krabi-caliper/rigs:/rigs:ro
    env:
      RIG: stm32f407-dwt
      KRABI_RIG_DIR: /rigs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: chunked 5x20 conditioned campaign
        shell: bash
        working-directory: ct-verify/cyccnt-hardware
        run: |
          set -uo pipefail
          export PATH="/usr/local/cargo/bin:$HOME/.cargo/bin:$PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          env_file="${KRABI_RIG_DIR:-$HOME/.config/krabi-caliper/rigs}/$RIG.env"
          [ -f "$env_file" ] || { echo "::error::rig '$RIG' has no env ($env_file)"; exit 1; }
          set -a; source "$env_file"; set +a
          : "${KRABI_PROBE:?rig $RIG did not export KRABI_PROBE}"

          exec 9>"/run/lock/krabi-rig-$RIG"
          flock -w 1800 9
          probe-rs list | grep -qF "$KRABI_PROBE" \
            || { echo "::error::probe $KRABI_PROBE not attached"; exit 1; }

          CHIP=(--chip STM32F407VGTx --protocol swd --probe "$KRABI_PROBE" --non-interactive)

          cargo build --release --target thumbv7em-none-eabihf --no-default-features \
            --features clock-168mhz,rsa512,carrier-u32x16,statistical-chunk
          ELF=$(find "$GITHUB_WORKSPACE" -type f \
                  -path '*thumbv7em-none-eabihf/release/rsa-cyccnt-hardware' 2>/dev/null | head -1)
          [ -n "$ELF" ] || { echo "::error::chunk ELF not found"; exit 1; }

          capture_chunk() {   # $1 = log path; success iff EM_SUMMARY captured
            local log="$1"; : > "$log"
            probe-rs download "${CHIP[@]}" --disable-progressbars "$ELF" >/dev/null 2>&1 || return 1
            probe-rs reset "${CHIP[@]}" >/dev/null 2>&1 || true
            ( timeout 130 probe-rs attach "${CHIP[@]}" --disable-progressbars --no-location "$ELF" >"$log" 2>&1 ) &
            local pid=$! waited=0
            while [ "$waited" -lt 130 ]; do
              grep -q "EM_SUMMARY" "$log" 2>/dev/null && break
              kill -0 "$pid" 2>/dev/null || break
              sleep 2; waited=$((waited+2))
            done
            kill "$pid" 2>/dev/null; wait "$pid" 2>/dev/null || true
            grep -q "EM_SUMMARY" "$log"
          }

          : > pooled.log
          ok=0
          for c in 1 2 3 4 5; do
            for a in 1 2 3; do
              if capture_chunk "chunk_${c}.log"; then
                grep -E "EM_SAMPLE|EM_BEGIN|CT_BEGIN" "chunk_${c}.log" | sed "s/^/SLICE${c} /" >> pooled.log
                ok=$((ok+1)); echo "slice $c captured (attempt $a)"; break
              fi
              echo "::warning::slice $c attempt $a faulted; retrying"; sleep 3
            done
          done
          echo "slices captured: $ok / 5"

          echo "############## POOLED RESULT ##############"
          python3 - <<'PY'
          import re, math
          from statistics import mean, pstdev
          rows={}; wraps=0; cond=False
          for line in open('pooled.log'):
              if 'sign_conditioning:per-sample-prewarm' in line: cond=True
              m=re.search(r'EM_SAMPLE .*fixture:(\S+) side:(\S+) index:\d+ ticks:(\d+) wrapped:(\d+)', line)
              if m:
                  fx,side,t,w=m.group(1),m.group(2),int(m.group(3)),int(m.group(4))
                  rows.setdefault((fx,side),[]).append(t); wraps+=w
          print(f"conditioning field present: {cond}")
          print(f"DWT wraps: {wraps}")
          def welch(a,b):
              ma,mb=mean(a),mean(b); va,vb=pstdev(a)**2,pstdev(b)**2
              den=math.sqrt(va/len(a)+vb/len(b))
              return (None if den==0 else (ma-mb)/den), ma-mb
          for fx in ['pkcs1v15_blinded_sign','negative_early_exit','key_construction']:
              a=rows.get((fx,'A')); b=rows.get((fx,'B'))
              if not a and not b: continue
              print(f"\n== {fx} ==")
              if a: print(f"  A: n={len(a)} mean={mean(a):.1f} spread={max(a)-min(a)} sd={pstdev(a):.2f}")
              if b: print(f"  B: n={len(b)} mean={mean(b):.1f} spread={max(b)-min(b)} sd={pstdev(b):.2f}")
              if a and b:
                  t,delta=welch(a,b)
                  if t is None:
                      print(f"  A-B delta={delta:+.1f}  (zero variance; {'IDENTICAL' if delta==0 else 'deterministic offset'})")
                  else:
                      print(f"  A-B delta={delta:+.1f}  Welch t={t:.3f}  thr=4.5 -> {'BELOW (pass)' if abs(t)<4.5 else 'EXCEEDS'}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chunked-conditioned-log
          path: ct-verify/cyccnt-hardware/pooled.log
          if-no-files-found: warn
